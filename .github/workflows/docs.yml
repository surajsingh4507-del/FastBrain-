name: Docs

# Builds the documentation with MkDocs to verify it has no errors.
# To publish to GitHub Pages: Settings > Pages > Source: GitHub Actions,
# then uncomment the configure-pages, upload-pages-artifact, and deploy steps.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[openai,anthropic,otel]" "mkdocs-material>=9.5" "mkdocstrings[python]>=0.26"
      - run: mkdocs build --strict
